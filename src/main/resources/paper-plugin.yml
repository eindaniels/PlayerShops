name: PlayerShops
version: '${version}'
main: de.eindaniel.playerShops.Main
authors:
  - eindaniel
  - Cytooxien (Idea)
description: "PlayerShops – inspired from Cytooxien.net"
website: "https://github.com/eindaniels/PlayerShops"
api-version: '1.20'

dependencies:
  server:
    Vault:
      required: true
      load: BEFORE

permissions:
  playershop.create:
    description: "Allows the creation of an PlayerShop."
    default: true
  playershop.remove:
    description: "Allows the deletion of an PlayerShop"
    default: true
  playershop.admin:
    description: "Allows Admin-Features (Removing others Shops)"
    default: op
