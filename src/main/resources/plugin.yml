name: PlayerShops
version: '${version}'
main: de.eindaniel.playerShops.Main
authors:
  - eindaniel
  - Cytooxien (Idea)
description: "PlayerShops – inspired from Cytooxien.net"
website: "https://github.com/eindaniels/PlayerShops"
api-version: '1.20'
depend:
  - Vault

commands:
  createshop:
    description: Creates a new PlayerShop.
    permission: playershop.create
  removeshop:
    description: Removes your PlayerShop.
    permission: playershop.remove

permissions:
  playershop.create:
    description: "Allows the creation of an PlayerShop."
    default: true
  playershop.remove:
    description: "Allows the deletion of an PlayerShop"
    default: true
  playershop.admin:
    description: "Allows Admin-Features (Removing others Shops)"
    default: op