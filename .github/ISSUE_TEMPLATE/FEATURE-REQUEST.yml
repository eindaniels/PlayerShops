name: Feature request
description: Suggest an idea or improvement for PlayerShops
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! Please check that it hasn't been requested already.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this feature has not been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your request related to a problem?
      description: Describe what is missing or annoying right now.
      placeholder: "I'm always frustrated when ..."

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other solutions, workarounds or plugins you tried.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples from other plugins, etc.